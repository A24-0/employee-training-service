{% with section=request.resolver_match.namespace %}
    <nav class="nav site-nav">
        <a
            class="nav-link {% if section == 'homepage' %}active{% endif %}"
            href="{% url 'homepage:index' %}"
        >Главная</a>
        <a
            class="nav-link {% if section == 'courses' %}active{% endif %}"
            href="{% url 'courses:list' %}"
        >Курсы</a>
        <a
            class="nav-link {% if section == 'enrollments' and request.resolver_match.url_name != 'statistics' %}active{% endif %}"
            href="{% url 'enrollments:list' %}"
        >Назначения</a>
        <a
            class="nav-link {% if request.resolver_match.url_name == 'statistics' %}active{% endif %}"
            href="{% url 'enrollments:statistics' %}"
        >Статистика</a>
    </nav>
{% endwith %}
